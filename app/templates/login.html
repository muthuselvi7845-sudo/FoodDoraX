{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>FoodDoraX - Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-body">

<div class="auth-box">

    <h1>🍔 FoodDoraX</h1>

    <h2>Welcome Back!</h2>

    {% if error %}
        <p class="auth-error">{{ error }}</p>
    {% endif %}

    <form method="POST" autocomplete="off">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               value="{{ username|default:'' }}"
               autocomplete="off"
               required
               class="auth-input">

        <input type="password"
               name="password"
               placeholder="Password"
               autocomplete="off"
               required
               class="auth-input">

        <button type="submit" class="auth-btn">Login</button>

    </form>

    <p class="auth-footer">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

</body>
</html>
