{% extends "admin/base_site.html" %}

{% block content %}
<h1>Import Food Items from Excel</h1>

<p>Excel format required (first row = headers):</p>
<table style="border-collapse: collapse; margin-bottom: 20px;">
    <tr>
        <th style="border:1px solid #ccc; padding:6px;">restaurant_name</th>
        <th style="border:1px solid #ccc; padding:6px;">location</th>
        <th style="border:1px solid #ccc; padding:6px;">food_name</th>
        <th style="border:1px solid #ccc; padding:6px;">price</th>
        <th style="border:1px solid #ccc; padding:6px;">image_url</th>
        <th style="border:1px solid #ccc; padding:6px;">is_veg</th>
    </tr>
    <tr>
        <td style="border:1px solid #ccc; padding:6px;">A2B Restaurant</td>
        <td style="border:1px solid #ccc; padding:6px;">Chennai</td>
        <td style="border:1px solid #ccc; padding:6px;">Idly</td>
        <td style="border:1px solid #ccc; padding:6px;">15</td>
        <td style="border:1px solid #ccc; padding:6px;">https://...</td>
        <td style="border:1px solid #ccc; padding:6px;">YES</td>
    </tr>
</table>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Upload and Import" class="default">
</form>
{% endblock %}
